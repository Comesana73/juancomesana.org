<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<!-- The page may only talk to Google's Apps Script servers, plus cdnjs for the pinned PDF
     reader (loaded with integrity checks) and Google Fonts for the typeface. Inline scripts are needed because the role's
     interface arrives from the server after the link is checked. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://script.google.com https://script.googleusercontent.com https://cdnjs.cloudflare.com; worker-src blob:; img-src data: blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>YEP Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
  :root { --ground: #F3F4F6; --surface: #FFFFFF; --border: #E5E7EB; --text: #111827; --muted: #4B5563; --accent: #2448B8; --on-accent: #FFFFFF; --track: #E5E7EB; --subtle: #F9FAFB; }
  @media (prefers-color-scheme: dark) { :root { --ground: #0F1115; --surface: #171A21; --border: #2A2F3A; --text: #E8EAEE; --muted: #A3AAB6; --accent: #8EA6FF; --on-accent: #0B1533; --track: #2A2F3A; --subtle: #1C2028; } }
  body { margin: 0; background: var(--ground); color: var(--text);
         font-family: Manrope, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.5; }
  .notice { max-width: 480px; margin: 12vh auto 0; padding: 0 16px; }
  .notice-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; box-shadow: 0 1px 2px rgba(17,24,39,.04); }
  .mark { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; font-weight: 700; margin-bottom: 18px; }
  .notice h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .notice p { color: var(--muted); margin: 0; }
  .skel { display: block; height: 12px; border-radius: 6px; margin-top: 12px; background: linear-gradient(90deg, var(--track), var(--subtle), var(--track)); background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
</style>
</head>
<body>
<div id="app"><div class="notice"><div class="notice-card" aria-busy="true"><div class="mark" aria-hidden="true">Y</div><p>Loading YEP Review…</p><span class="skel" style="width:80%"></span><span class="skel" style="width:55%"></span></div></div></div>
<script>
/*
 * YEP Review loader. This is the only public part of the app: it reads the private code
 * from the link (after #, which browsers never send to a server) and asks the app's
 * Google Apps Script backend for the page. The backend checks the code and returns only
 * the screens for that person's role; without a valid code nothing comes back.
 */
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbz8R_17ZuTS0ts1Liru1el87hw4-_ArQIIOTNlCQxFX1rZ16Cxbav9d-O9Esaeb_f8z/exec';
  var app = document.getElementById('app');

  // Pasting a different link into an open tab only changes the part after #; start over.
  window.addEventListener('hashchange', function () {
    location.reload();
  });

  function notice(title, text) {
    app.innerHTML = '<div class="notice"><div class="notice-card"><div class="mark" aria-hidden="true">Y</div><h1></h1><p></p></div></div>';
    app.querySelector('h1').textContent = title;
    app.querySelector('p').textContent = text;
  }

  var m = /(?:^#|&)t=([a-f0-9]{64})(?:&|$)/.exec(location.hash);
  if (!m) {
    notice('This link isn’t valid', 'It may be incomplete. Please use the full link the organizers emailed you.');
    return;
  }
  window.YEP = { token: m[1], api: API };

  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: m[1], action: 'page', args: {} }),
    credentials: 'omit',
    redirect: 'follow'
  })
    .then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    })
    .then(function (res) {
      if (!res || !res.ok) {
        notice('This link isn’t valid', 'It may be out of date. Please use the most recent link the organizers emailed you, or ask them for a new one.');
        return;
      }
      document.title = res.data.title;
      app.innerHTML = res.data.html;
      // Scripts inserted with innerHTML don't run; recreate them, in order.
      Array.prototype.forEach.call(app.querySelectorAll('script'), function (old) {
        var s = document.createElement('script');
        s.text = old.textContent;
        old.parentNode.replaceChild(s, old);
      });
    })
    .catch(function () {
      notice('Couldn’t load the page', 'Check your internet connection and reload. If it keeps happening, tell the organizers.');
    });
})();
</script>
</body>
</html>
