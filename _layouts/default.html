<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    {% include head.html %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-title" href="{{ '/' | relative_url }}">Juan Comesaña</a>
        {% include navigation.html %}
      </div>
    </header>
    <main id="main" class="site-main">
      {{ content }}
    </main>

    <div class="lightbox" id="lightbox" hidden>
      <button type="button" class="lightbox__close" id="lightbox-close" aria-label="Close">&times;</button>
      <button type="button" class="lightbox__prev" id="lightbox-prev" aria-label="Previous photo">&lsaquo;</button>
      <img class="lightbox__image" id="lightbox-image" src="" alt="">
      <button type="button" class="lightbox__next" id="lightbox-next" aria-label="Next photo">&rsaquo;</button>
      <div class="lightbox__counter" id="lightbox-counter"></div>
    </div>

    <script>
      document.querySelectorAll(".site-main a[href]").forEach((link) => {
        if (link.href && !link.closest(".rec-page .button-list") && !link.closest(".photo-grid")) {
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        }
      });
    </script>
    <script>
      (function () {
        var grids = document.querySelectorAll(".photo-grid");
        if (!grids.length) return;

        var lightbox = document.getElementById("lightbox");
        var imageEl = document.getElementById("lightbox-image");
        var counterEl = document.getElementById("lightbox-counter");
        var closeBtn = document.getElementById("lightbox-close");
        var prevBtn = document.getElementById("lightbox-prev");
        var nextBtn = document.getElementById("lightbox-next");
        var photos = [];
        var current = 0;

        grids.forEach(function (grid) {
          grid.querySelectorAll("a").forEach(function (link) {
            var index = photos.length;
            photos.push({
              href: link.getAttribute("href"),
              alt: link.querySelector("img") ? link.querySelector("img").alt : ""
            });
            link.addEventListener("click", function (event) {
              event.preventDefault();
              open(index);
            });
          });
        });

        function open(index) {
          current = index;
          show();
          lightbox.hidden = false;
          closeBtn.focus();
          document.addEventListener("keydown", onKeydown);
        }

        function close() {
          lightbox.hidden = true;
          document.removeEventListener("keydown", onKeydown);
        }

        function show() {
          var photo = photos[current];
          imageEl.src = photo.href;
          imageEl.alt = photo.alt;
          counterEl.textContent = (current + 1) + " / " + photos.length;
        }

        function prev() {
          current = (current - 1 + photos.length) % photos.length;
          show();
        }

        function next() {
          current = (current + 1) % photos.length;
          show();
        }

        function onKeydown(event) {
          if (event.key === "Escape") close();
          if (event.key === "ArrowLeft") prev();
          if (event.key === "ArrowRight") next();
        }

        closeBtn.addEventListener("click", close);
        prevBtn.addEventListener("click", prev);
        nextBtn.addEventListener("click", next);
        lightbox.addEventListener("click", function (event) {
          if (event.target === lightbox) close();
        });
      })();
    </script>
  </body>
</html>
