title: "Juan Comesaña"
description: "Academic website for Juan Comesaña, Professor of Philosophy at Rutgers University."
url: "https://juancomesana.org"
baseurl: ""
lang: "en-US"
timezone: "America/New_York"

permalink: pretty

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/juan-comesana.webp
  - scope:
      path: "private"
    values:
      sitemap: false
  - scope:
      path: "frame"
    values:
      sitemap: false
  - scope:
      path: "rec/yep/review"
    values:
      sitemap: false
  - scope:
      path: "yep"
    values:
      sitemap: false
  - scope:
      path: "phil109"
    values:
      sitemap: false
      noindex: true
  - scope:
      path: "tools"
    values:
      sitemap: false
